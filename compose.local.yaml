# Perfil LOCAL (desenvolvimento). Uso: ./stack.sh local up -d --build
# Equivale a: docker compose --env-file .env.local -f compose.yaml -f compose.local.yaml ...
# Portas de gestao so em 127.0.0.1. Mensagens de WhatsApp so no log, salvo NOTIFICATION_SEND_ENABLED=true.
name: beauty-local

x-local-java: &local-java
  SPRING_PROFILES_ACTIVE: local

services:
  postgres:
    ports:
      - '127.0.0.1:5432:5432'
  rabbitmq:
    ports:
      - '127.0.0.1:15672:15672'   # painel de gestao do RabbitMQ
  minio:
    ports:
      - '127.0.0.1:9001:9001'     # console do MinIO
  evolution-api:
    ports:
      - '127.0.0.1:8081:8080'     # API e gerenciador (/manager) da Evolution: conexao do numero por QR Code
  discovery-server:
    environment: *local-java
    ports:
      - '127.0.0.1:8761:8761'     # painel do Eureka
  api-gateway:
    environment: *local-java
  booking-service:
    environment: *local-java
  notification-service:
    environment: *local-java

  # Sandbox do WhatsApp: imita o envio da Evolution API e mostra as mensagens em http://localhost:8099.
  # Só sobe com o perfil whatsapp-sandbox (./whatsapp.sh sandbox).
  whatsapp-sandbox:
    image: python:3.13.18-alpine3.24
    profiles: ['whatsapp-sandbox']
    command: ['python', '/app/server.py']
    environment:
      SANDBOX_API_KEY: ${EVOLUTION_API_KEY}
      SANDBOX_INSTANCE: ${EVOLUTION_INSTANCE:-beauty-studio}
    volumes:
      - ./infra/whatsapp-sandbox/server.py:/app/server.py:ro
    ports:
      - '127.0.0.1:8099:8080'
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/health")']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 64m
    restart: unless-stopped
