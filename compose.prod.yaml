# Perfil PROD (producao). Uso: ./stack.sh prod up -d --build
# Equivale a: docker compose --env-file .env.prod -f compose.yaml -f compose.prod.yaml ...
# Imagens construidas na propria maquina (tag "prod"), sem registry.
# Diferencas para o local:
#   - perfil Spring "prod": cookie Secure obrigatorio, URLs publicas em https, saude sem detalhes, sem painel do Eureka;
#   - envio real de WhatsApp suspenso (desligado por padrao; ver README);
#   - so o Caddy publica portas (80 e 443, HTTPS automatico para API_DOMAIN); o gateway fica so na rede interna;
#   - a Evolution fica em 127.0.0.1 (acesso por tunel SSH para ler o QR Code);
#   - rotacao de log dos conteineres;
#   - URLs publicas e CORS obrigatorios no .env.prod.
name: beauty-prod

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '5'

x-prod-java: &prod-java
  SPRING_PROFILES_ACTIVE: prod

services:
  postgres:
    <<: *logging
  rabbitmq:
    <<: *logging
  minio:
    <<: *logging
  evolution-api:
    <<: *logging
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:?defina EVOLUTION_SERVER_URL no .env.prod}
    ports:
      - '127.0.0.1:${EVOLUTION_LOCAL_PORT:-8081}:8080'
  discovery-server:
    <<: *logging
    environment: *prod-java
  # Proxy HTTPS da API: unica entrada publica
  caddy:
    <<: *logging
    image: caddy:2.11.7-alpine
    depends_on:
      api-gateway:
        condition: service_healthy
    environment:
      API_DOMAIN: '${API_DOMAIN:?defina API_DOMAIN no .env.prod, por exemplo api.salao.com.br}'
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m
    restart: unless-stopped

  api-gateway:
    <<: *logging
    # So na rede interna: o Caddy e a entrada publica
    ports: !reset []
    environment:
      <<: *prod-java
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?defina APP_CORS_ALLOWED_ORIGINS no .env.prod}
  booking-service:
    <<: *logging
    environment:
      <<: *prod-java
      APP_COOKIE_SECURE: 'true'
      # Front na Vercel (salao.com.br) e API aqui (api.salao.com.br): domínio comum do cookie de sessão
      APP_COOKIE_DOMAIN: ${APP_COOKIE_DOMAIN:-}
      # Caddy + gateway à frente do booking
      LOGIN_TRUSTED_PROXY_HOPS: ${LOGIN_TRUSTED_PROXY_HOPS:-2}
      APP_PUBLIC_FRONT_URL: ${APP_PUBLIC_FRONT_URL:?defina APP_PUBLIC_FRONT_URL no .env.prod}
      APP_PUBLIC_MEDIA_URL: ${APP_PUBLIC_MEDIA_URL:?defina APP_PUBLIC_MEDIA_URL no .env.prod}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD no .env.prod}
  notification-service:
    <<: *logging
    environment:
      <<: *prod-java
      NOTIFICATION_SEND_ENABLED: ${NOTIFICATION_SEND_ENABLED:-false}
      APP_PUBLIC_FRONT_URL: ${APP_PUBLIC_FRONT_URL:?defina APP_PUBLIC_FRONT_URL no .env.prod}

volumes:
  caddy-data:
  caddy-config:
