spring:
  application:
    name: discovery-server
  threads:
    virtual:
      enabled: ${APP_VIRTUAL_THREADS:true}

server:
  port: ${SERVER_PORT:8761}

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    # Servidor unico: nao se registra nem busca registro de outros servidores
    register-with-eureka: false
    fetch-registry: false
  server:
    # Poucas instancias: sem modo de autopreservacao, instancia parada sai do registro
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
