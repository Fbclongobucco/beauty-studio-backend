# Perfil prod: sem detalhes internos nas respostas de saude e de erro.
management:
  endpoint:
    health:
      show-details: never

server:
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

logging:
  level:
    root: INFO
    com.longobuccodev.beautystudio: INFO

# Producao roda atras de HTTPS: cookie de sessao Secure por padrao
beauty:
  security:
    cookie-secure: ${APP_COOKIE_SECURE:true}
