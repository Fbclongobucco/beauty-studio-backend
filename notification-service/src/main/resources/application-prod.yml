# Perfil prod: sem detalhes internos nas respostas de saude e de erro.
management:
  endpoint:
    health:
      show-details: never

server:
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

logging:
  level:
    root: INFO
    com.longobuccodev.beautystudio: INFO

# Envio de WhatsApp suspenso: desligado por padrao tambem em producao
beauty:
  notification:
    send-enabled: ${NOTIFICATION_SEND_ENABLED:false}
