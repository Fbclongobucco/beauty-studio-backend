spring:
  application:
    name: notification-service
  threads:
    virtual:
      enabled: ${APP_VIRTUAL_THREADS:true}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notification}
    username: ${DB_USERNAME:notification}
    password: ${DB_PASSWORD:notification}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: ${SERVER_PORT:8080}

beauty:
  messaging:
    consumer:
      queue: notification.appointment-events
      routing-keys: appointment.*
      retry-delays: 10s,1m,5m
      max-attempts: 5
      prefetch: 5
  notification:
    send-enabled: ${NOTIFICATION_SEND_ENABLED:false}
    salon-whatsapp: ${SALON_WHATSAPP:}
    front-url: ${APP_PUBLIC_FRONT_URL:http://localhost:3000}
    evolution:
      base-url: ${EVOLUTION_API_URL:http://localhost:8081}
      api-key: ${EVOLUTION_API_KEY:}
      instance: ${EVOLUTION_INSTANCE:beauty-studio}
      timeout: ${EVOLUTION_TIMEOUT:10s}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
