# API do Beauty Studio atrás do Nginx que já existe no servidor (perfil lite).
# Faz o que o Caddy faria: /api -> booking-service, /media -> fotos no MinIO (só leitura), 503 padronizado.
# Instalação (DEPLOY.md, "Servidor que já tem Nginx"):
#   sudo cp infra/nginx/beauty-studio-api.conf /etc/nginx/sites-available/beauty-studio-api
#   sudo sed -i 's/API_DOMAIN/91-252-193-21.sslip.io/' /etc/nginx/sites-available/beauty-studio-api
#   sudo ln -s /etc/nginx/sites-available/beauty-studio-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d 91-252-193-21.sslip.io --redirect     # adiciona o HTTPS e o redirecionamento
# Portas: as do compose.lite.yaml (BOOKING_LOCAL_PORT=18080, MINIO_LOCAL_PORT=19000), só em 127.0.0.1.
server {
    listen 80;
    listen [::]:80;
    server_name API_DOMAIN;

    # Fotos de até 5 MB; folga para o multipart
    client_max_body_size 8m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    # A cliente e o painel. O X-Forwarded-For com o IP de quem conectou vai para o limite de tentativas de login.
    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Fotos públicas dos serviços: /media/service-photos/... -> MinIO /service-photos/... (a barra final tira o /media)
    location /media/ {
        limit_except GET {
            deny all;
        }
        proxy_pass http://127.0.0.1:19000/;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }

    # Booking ou MinIO fora do ar: mesmo erro padronizado que o gateway devolve no perfil completo
    error_page 502 503 504 = @indisponivel;
    location @indisponivel {
        default_type application/json;
        return 503 '{"code":"SERVICE_UNAVAILABLE","message":"Serviço temporariamente indisponível. Tente de novo em instantes."}';
    }
}
